name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v0.2.0). Leave empty for a dry-run build without publishing."
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            linker: gcc-aarch64-linux-gnu
          # macOS
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          # Windows
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross linker (Linux aarch64)
        if: matrix.linker != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.linker }}
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          bin="gh-autoswitch"
          version="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            version="${{ github.event.inputs.tag }}"
            [[ -z "$version" ]] && version="$(git rev-parse --short HEAD)"
          fi
          name="${bin}-${version}-${{ matrix.target }}"
          staging="dist/${name}"
          mkdir -p "$staging"

          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            ext=".exe"
          else
            ext=""
          fi
          cp "target/${{ matrix.target }}/release/${bin}${ext}" "$staging/"
          cp README.md LICENSE config.example.yml "$staging/" 2>/dev/null || true

          mkdir -p artifacts
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            archive="artifacts/${name}.zip"
            (cd dist && 7z a -tzip "../${archive}" "${name}") >/dev/null
          else
            archive="artifacts/${name}.tar.gz"
            tar -czf "$archive" -C dist "${name}"
          fi

          # checksum
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" | awk '{print $1}' > "${archive}.sha256"
          else
            shasum -a 256 "$archive" | awk '{print $1}' > "${archive}.sha256"
          fi

          echo "archive=${archive}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: gh-autoswitch-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
